# Remote synchronization scenario
# Tests syncing between different remotes (origin and upstream)
trees:
- root: test_remote_sync
  repos:
  - name: test-repo
    remotes:
    - name: origin
      url: https://github.com/octocat/Hello-World
    - name: upstream
      url: https://github.com/octocat/Spoon-Knife
    branches:
    - name: master
      remote: origin
      is_current: true